[project]
name = "dvt-sync"
version = "0.1.0"
description = "Presence-triggered sync of Philips VoiceTracer DVT6110 recordings into a transcription pipeline inbox"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dvt-sync contributors" }]
keywords = ["philips", "voicetracer", "dvt6110", "voice-recorder", "websocket", "sync"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Multimedia :: Sound/Audio",
]
requires-python = ">=3.11"
dependencies = ["websockets>=13"]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.5",
]

[project.scripts]
dvtsync = "dvtsync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dvtsync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF"]
ignore = [
    "SIM105",   # try/except/pass is clearer than contextlib.suppress here
    "ASYNC109", # explicit timeout parameters are part of the API
    "ASYNC230", # local file I/O is tiny next to the network transfer
    "ASYNC240", # same, for pathlib calls
]

[tool.ruff.lint.per-file-ignores]
# exploratory scripts kept as they were used against the device
"tools/*" = ["E401", "E701", "E702", "SIM115"]
